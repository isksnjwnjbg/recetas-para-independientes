<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recetas para independientes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #ffffff;
      --bg2:      #f4f4f4;
      --bg3:      #e8e8e8;
      --text:     #111111;
      --text2:    #666666;
      --border:   rgba(0,0,0,0.10);
      --border2:  rgba(0,0,0,0.22);
      --radius-md: 8px;
      --radius-lg: 14px;
      --accent:   #111111;
      --accent-bg:#f0f0f0;
      --accent-text: #111111;
      --badge-bg: #e2e2e2;
      --badge-txt:#333333;
      --toggle-bg:#ddd;
      --nav-shadow: 0 1px 0 var(--border);
    }
    [data-theme="dark"] {
      --bg:       #111111;
      --bg2:      #1c1c1c;
      --bg3:      #252525;
      --text:     #f0f0f0;
      --text2:    #888888;
      --border:   rgba(255,255,255,0.09);
      --border2:  rgba(255,255,255,0.18);
      --accent:   #f0f0f0;
      --accent-bg:#252525;
      --accent-text:#f0f0f0;
      --badge-bg: #2a2a2a;
      --badge-txt:#aaaaaa;
      --toggle-bg:#444;
      --nav-shadow: 0 1px 0 var(--border);
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.25s, color 0.25s;
    }

    /* NAV */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 0.5px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
      box-shadow: var(--nav-shadow);
    }
    .logo { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
    .logo em { font-style: normal; opacity: 0.38; font-weight: 400; }
    #count { font-size: 12px; color: var(--text2); }

    .nav-right { display: flex; align-items: center; gap: 14px; }

    /* DARK MODE TOGGLE */
    .toggle-btn {
      width: 42px; height: 24px;
      border-radius: 12px;
      background: var(--toggle-bg);
      border: none;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle-btn::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--bg);
      transition: transform 0.2s, background 0.2s;
    }
    [data-theme="dark"] .toggle-btn { background: #555; }
    [data-theme="dark"] .toggle-btn::after { transform: translateX(18px); background: #f0f0f0; }
    .toggle-icon { font-size: 13px; }

    /* SEARCH */
    .search-bar { padding: 0.65rem 1.5rem; border-bottom: 0.5px solid var(--border); background: var(--bg); }
    .search-bar input {
      width: 100%; padding: 8px 14px;
      border: 0.5px solid var(--border2);
      border-radius: var(--radius-md);
      font-size: 14px;
      background: var(--bg2);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .search-bar input::placeholder { color: var(--text2); }
    .search-bar input:focus { border-color: var(--accent); background: var(--bg); }

    /* TABS — drag to scroll */
    .tabs-wrapper {
      border-bottom: 0.5px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
      cursor: grab;
      user-select: none;
      -webkit-overflow-scrolling: touch;
      background: var(--bg);
      position: sticky;
      top: 57px;
      z-index: 90;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }
    .tabs-wrapper.dragging { cursor: grabbing; }
    .tabs { display: flex; padding: 0 1.5rem; gap: 0; min-width: max-content; }
    .tab {
      padding: 10px 16px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text2);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
      pointer-events: auto;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 12px;
      padding: 1.25rem 1.5rem;
    }

    /* CARD */
    .card {
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
    }
    .card:hover {
      border-color: var(--border2);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    [data-theme="dark"] .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
    .card-img { height: 108px; display: flex; align-items: center; justify-content: center; font-size: 44px; background: var(--bg3); }
    .card-body { padding: 12px; }
    .card-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; line-height: 1.3; }
    .card-meta { font-size: 12px; color: var(--text2); }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      margin-top: 6px;
      background: var(--badge-bg);
      color: var(--badge-txt);
    }

    .empty { padding: 3rem 1.5rem; text-align: center; color: var(--text2); font-size: 14px; }
    .hidden { display: none; }

    /* DETAIL */
    .detail { padding: 1.5rem; max-width: 680px; }
    .back-btn {
      font-size: 13px; color: var(--text2); cursor: pointer;
      background: none; border: none; padding: 0;
      margin-bottom: 1.25rem;
      display: flex; align-items: center; gap: 6px;
      transition: color 0.15s;
    }
    .back-btn:hover { color: var(--text); }
    .detail-emoji { font-size: 52px; margin-bottom: 12px; }
    .detail-title { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
    .detail-sub { font-size: 14px; color: var(--text2); margin-bottom: 1.5rem; }
    .section-label {
      font-size: 11px; font-weight: 600; color: var(--text2);
      margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.07em;
    }
    .ing-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.5rem; }
    .ing {
      font-size: 13px; padding: 5px 12px;
      border-radius: var(--radius-md);
      background: var(--bg2); color: var(--text);
      border: 0.5px solid var(--border);
    }
    .steps { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .step { display: flex; gap: 12px; font-size: 14px; line-height: 1.6; }
    .step-num {
      min-width: 24px; height: 24px; border-radius: 50%;
      background: var(--bg3); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; margin-top: 2px; flex-shrink: 0;
    }
    .note {
      font-size: 13px; color: var(--text2);
      background: var(--bg2);
      border-radius: var(--radius-md);
      padding: 12px 14px; margin-top: 1.25rem; line-height: 1.5;
      border: 0.5px solid var(--border);
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="logo">Recetas <em>para independientes</em></div>
  <div class="nav-right">
    <span id="count"></span>
    <span class="toggle-icon" id="theme-icon">🌙</span>
    <button class="toggle-btn" id="theme-toggle" aria-label="Cambiar tema"></button>
  </div>
</nav>

<div class="search-bar">
  <input type="text" id="search" placeholder="Buscar receta..." oninput="applyFilters()" />
</div>

<div class="tabs-wrapper" id="tabs-wrapper">
  <div class="tabs" id="tabs"></div>
</div>

<div id="list-view">
  <div class="grid" id="grid"></div>
  <div class="empty hidden" id="empty">No se encontraron recetas.</div>
</div>

<div id="detail-view" class="detail hidden">
  <button class="back-btn" onclick="showList()">&#8592; Volver</button>
  <div id="detail-content"></div>
</div>

<script>
// ── DARK MODE ──────────────────────────────────────────────
const toggleBtn  = document.getElementById('theme-toggle');
const themeIcon  = document.getElementById('theme-icon');
const htmlEl     = document.documentElement;

function setTheme(dark) {
  htmlEl.setAttribute('data-theme', dark ? 'dark' : 'light');
  themeIcon.textContent = dark ? '☀️' : '🌙';
  localStorage.setItem('theme', dark ? 'dark' : 'light');
}
toggleBtn.addEventListener('click', () => {
  setTheme(htmlEl.getAttribute('data-theme') !== 'dark');
});
// Init from saved preference
setTheme(localStorage.getItem('theme') === 'dark');


// ── DRAG-TO-SCROLL ─────────────────────────────────────────
(function() {
  const wrapper = document.getElementById('tabs-wrapper');
  let isDown = false, startX = 0, scrollLeft = 0, moved = false;

  wrapper.addEventListener('mousedown', e => {
    isDown = true; moved = false;
    wrapper.classList.add('dragging');
    startX    = e.pageX - wrapper.offsetLeft;
    scrollLeft = wrapper.scrollLeft;
  });
  window.addEventListener('mouseup', () => {
    isDown = false;
    wrapper.classList.remove('dragging');
  });
  wrapper.addEventListener('mousemove', e => {
    if (!isDown) return;
    e.preventDefault();
    const x    = e.pageX - wrapper.offsetLeft;
    const walk = (x - startX) * 1.4;
    if (Math.abs(walk) > 4) moved = true;
    wrapper.scrollLeft = scrollLeft - walk;
  });
  // Block tab click if we were dragging
  wrapper.addEventListener('click', e => {
    if (moved) e.stopPropagation();
  }, true);
})();

// ── UI ─────────────────────────────────────────────────────
let currentCat  = "desayuno";
let searchTerm  = "";

function buildTabs() {
  const tabsEl = document.getElementById("tabs");
  categorias.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "tab" + (c.id === currentCat ? " active" : "");
    btn.textContent = c.emoji + " " + c.label;
    btn.onclick = () => selectTab(c.id, btn);
    tabsEl.appendChild(btn);
  });
}

function selectTab(id, btn) {
  currentCat = id;
  searchTerm = "";
  document.getElementById("search").value = "";
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  applyFilters();
}

function applyFilters() {
  searchTerm = document.getElementById("search").value.toLowerCase().trim();
  let lista = recetas.filter(r => r.cat === currentCat);
  if (searchTerm) lista = recetas.filter(r => r.nombre.toLowerCase().includes(searchTerm));
  render(lista);
}

function render(lista) {
  const g     = document.getElementById("grid");
  const empty = document.getElementById("empty");
  g.innerHTML = "";
  if (!lista.length) {
    empty.classList.remove("hidden");
    document.getElementById("count").textContent = "0 recetas";
    return;
  }
  empty.classList.add("hidden");
  document.getElementById("count").textContent = lista.length + " receta" + (lista.length !== 1 ? "s" : "");
  lista.forEach(r => {
    const d = document.createElement("div");
    d.className = "card";
    d.onclick = () => showDetail(r.id);
    d.innerHTML = `
      <div class="card-img">${r.emoji}</div>
      <div class="card-body">
        <div class="card-title">${r.nombre}</div>
        <div class="card-meta">${r.tiempo} · ${r.dif}</div>
        <span class="badge">${r.cat}</span>
      </div>`;
    g.appendChild(d);
  });
}

function showDetail(id) {
  const r = recetas.find(x => x.id === id);
  document.getElementById("list-view").classList.add("hidden");
  document.getElementById("detail-view").classList.remove("hidden");
  document.getElementById("detail-content").innerHTML = `
    <div class="detail-emoji">${r.emoji}</div>
    <div class="detail-title">${r.nombre}</div>
    <div class="detail-sub">${r.tiempo} &nbsp;·&nbsp; ${r.dif} &nbsp;·&nbsp; ${r.cat}</div>
    <p class="section-label">Ingredientes</p>
    <div class="ing-list">${r.ing.map(i => `<span class="ing">${i}</span>`).join("")}</div>
    <p class="section-label">Preparación</p>
    <ol class="steps">
      ${r.pasos.map((p, i) => `
        <li class="step">
          <span class="step-num">${i + 1}</span>
          <span>${p}</span>
        </li>`).join("")}
    </ol>
    <p class="note">💡 Esta receta es solo una guía base. ¡Adapta los ingredientes a tu gusto!</p>`;
}

function showList() {
  document.getElementById("detail-view").classList.add("hidden");
  document.getElementById("list-view").classList.remove("hidden");
}

buildTabs();
applyFilters();
</script>
